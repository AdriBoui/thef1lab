version: 2

models:
  - name: dim_meeting
    description: One row per Grand Prix / testing event of the season.
    columns:
      - name: meeting_key
        data_tests:
          - unique
          - not_null

  - name: dim_session
    description: One row per session (practice, qualifying, race) within a meeting.
    columns:
      - name: session_key
        data_tests:
          - unique
          - not_null
      - name: meeting_key
        data_tests:
          - relationships:
              to: ref('dim_meeting')
              field: meeting_key

  - name: dim_driver
    description: One row per driver, latest known team/details for the season.
    columns:
      - name: driver_number
        data_tests:
          - unique
          - not_null

  - name: fact_laps
    description: One row per driver per lap with sector times and speed traps.
    columns:
      - name: session_key
        data_tests:
          - relationships:
              to: ref('dim_session')
              field: session_key
      - name: driver_number
        data_tests:
          - relationships:
              to: ref('dim_driver')
              field: driver_number

  - name: fact_pit_stops
    description: One row per pit stop.
    columns:
      - name: session_key
        data_tests:
          - relationships:
              to: ref('dim_session')
              field: session_key
      - name: driver_number
        data_tests:
          # warn (not error): OpenF1 occasionally emits pit records for
          # phantom driver numbers (e.g. 241/243/247) that never appear in
          # the drivers endpoint. We surface the anomaly without failing the
          # build on corrupt upstream data.
          - relationships:
              to: ref('dim_driver')
              field: driver_number
              config:
                severity: warn

  - name: fact_race_results
    description: >
      One row per driver per Grand Prix or Sprint with final classification and
      points (each session type uses its own points scale).
    columns:
      - name: session_name
        data_tests:
          - accepted_values:
              values: ['Race', 'Sprint']
      - name: session_key
        data_tests:
          - relationships:
              to: ref('dim_session')
              field: session_key
      - name: driver_number
        data_tests:
          - relationships:
              to: ref('dim_driver')
              field: driver_number

  - name: fact_stints
    description: One row per driver per tyre stint (compound and lap range).
    columns:
      - name: session_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_session')
              field: session_key
      - name: driver_number
        data_tests:
          - relationships:
              to: ref('dim_driver')
              field: driver_number
              config:
                severity: warn

  - name: mart_pit_stop_performance
    description: Pit-stop performance ranked by team (median stationary time) across the season's races.
    columns:
      - name: team_name
        data_tests:
          - unique
          - not_null
      - name: median_stop_seconds
        data_tests:
          - not_null

  - name: mart_driver_standings
    description: Points per driver per race plus running cumulative total (championship evolution).
    columns:
      - name: cumulative_points
        data_tests:
          - not_null

  - name: mart_driver_pace
    description: Per-driver, per-race median lap time, fastest lap and lap-time consistency (std dev).
    columns:
      - name: median_lap_seconds
        data_tests:
          - not_null

  - name: fact_stint_degradation
    description: >
      One row per tyre stint with an estimated degradation slope (seconds lost
      per lap of tyre age), fitted by least squares on the stint's clean laps.
      An estimate, not a measurement: it also carries fuel burn, traffic and
      track evolution. NULL below 5 clean laps.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [session_key, driver_number, stint_number]
    columns:
      - name: session_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_session')
              field: session_key
      - name: driver_number
        data_tests:
          - not_null
      - name: compound
        data_tests:
          - not_null
          - accepted_values:
              values: [SOFT, MEDIUM, HARD, INTERMEDIATE, WET]
      - name: clean_laps
        description: Laps kept after dropping out/in laps, lap 1 and laps above 107% of the stint median.
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 1
      - name: degradation_s_per_lap
        description: >
          Raw least-squares slope of lap time against tyre age. Dominated by fuel
          burn, which makes the car quicker as the race goes on and cancels most
          of the tyre loss. Kept to show the bias; read the relative slope instead.
        # A stint gaining or losing more than 3 s per lap is not degradation,
        # it is a drying track or corrupt timing -- worth knowing about.
        data_tests:
          - dbt_utils.accepted_range:
              min_value: -3
              max_value: 3
      - name: relative_degradation_s_per_lap
        description: >
          Same slope, fitted on the lap time relative to the field median for that
          lap. Fuel burn and track evolution cancel out. Positive = faded faster
          than the field. Not an absolute loss: the field median carries the
          average tyre wear of the moment.
        data_tests:
          - dbt_utils.accepted_range:
              min_value: -3
              max_value: 3
      - name: pace_vs_field_seconds
        description: Mean gap to the field median over the stint's clean laps. Negative = quicker than the field.
        data_tests:
          - not_null
