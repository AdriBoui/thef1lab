version: 2

models:
  - name: dim_meeting
    description: One row per Grand Prix / testing event of the season.
    columns:
      - name: meeting_key
        data_tests:
          - unique
          - not_null

  - name: dim_session
    description: One row per session (practice, qualifying, race) within a meeting.
    columns:
      - name: session_key
        data_tests:
          - unique
          - not_null
      - name: meeting_key
        data_tests:
          - relationships:
              to: ref('dim_meeting')
              field: meeting_key

  - name: dim_driver
    description: One row per driver, latest known team/details for the season.
    columns:
      - name: driver_number
        data_tests:
          - unique
          - not_null

  - name: fact_laps
    description: One row per driver per lap with sector times and speed traps.
    columns:
      - name: session_key
        data_tests:
          - relationships:
              to: ref('dim_session')
              field: session_key
      - name: driver_number
        data_tests:
          - relationships:
              to: ref('dim_driver')
              field: driver_number

  - name: fact_pit_stops
    description: One row per pit stop.
    columns:
      - name: session_key
        data_tests:
          - relationships:
              to: ref('dim_session')
              field: session_key
      - name: driver_number
        data_tests:
          # warn (not error): OpenF1 occasionally emits pit records for
          # phantom driver numbers (e.g. 241/243/247) that never appear in
          # the drivers endpoint. We surface the anomaly without failing the
          # build on corrupt upstream data.
          - relationships:
              to: ref('dim_driver')
              field: driver_number
              config:
                severity: warn

  - name: fact_race_results
    description: >
      One row per driver per Grand Prix or Sprint with final classification and
      points (each session type uses its own points scale).
    columns:
      - name: session_name
        data_tests:
          - accepted_values:
              values: ['Race', 'Sprint']
      - name: session_key
        data_tests:
          - relationships:
              to: ref('dim_session')
              field: session_key
      - name: driver_number
        data_tests:
          - relationships:
              to: ref('dim_driver')
              field: driver_number
      - name: team_name
        description: Team the driver raced for in this session (point-in-time, not dim_driver's latest team).
        data_tests:
          - not_null

  - name: fact_stints
    description: One row per driver per tyre stint (compound and lap range).
    columns:
      - name: session_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_session')
              field: session_key
      - name: driver_number
        data_tests:
          - relationships:
              to: ref('dim_driver')
              field: driver_number
              config:
                severity: warn

  - name: fact_grid_vs_result
    description: >
      One row per driver per Grand Prix or Sprint: qualifying position, real starting grid
      (penalties applied) and finishing position, with grid penalty places and positions gained.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['session_key', 'driver_number']
    columns:
      - name: session_key
        data_tests:
          - relationships:
              to: ref('dim_session')
              field: session_key
      - name: grid_position
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 30
      - name: positions_gained
        data_tests:
          - dbt_utils.accepted_range:
              min_value: -29
              max_value: 29

  - name: mart_pit_stop_performance
    description: Pit-stop performance ranked by team (median stationary time) across the season's races.
    columns:
      - name: team_name
        data_tests:
          - unique
          - not_null
      - name: median_stop_seconds
        data_tests:
          - not_null

  - name: mart_driver_standings
    description: Points per driver per race plus running cumulative total (championship evolution).
    columns:
      - name: cumulative_points
        data_tests:
          - not_null

  - name: mart_constructor_standings
    description: >
      Constructors' championship: points per team per race weekend (Grand Prix + Sprint)
      plus running cumulative total. Teams are point-in-time, from fact_race_results.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['team_name', 'meeting_key']
    columns:
      - name: team_name
        data_tests:
          - not_null
      - name: cumulative_points
        data_tests:
          - not_null

  - name: mart_driver_pace
    description: Per-driver, per-race median lap time, fastest lap and lap-time consistency (std dev).
    columns:
      - name: median_lap_seconds
        data_tests:
          - not_null
