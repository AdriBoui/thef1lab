version: 2

models:
  - name: dim_meeting
    description: One row per Grand Prix / testing event of the season.
    columns:
      - name: meeting_key
        data_tests:
          - unique
          - not_null

  - name: dim_session
    description: One row per session (practice, qualifying, race) within a meeting.
    columns:
      - name: session_key
        data_tests:
          - unique
          - not_null
      - name: meeting_key
        data_tests:
          - relationships:
              to: ref('dim_meeting')
              field: meeting_key

  - name: dim_driver
    description: One row per driver, latest known team/details for the season.
    columns:
      - name: driver_number
        data_tests:
          - unique
          - not_null

  - name: fact_laps
    description: One row per driver per lap with sector times and speed traps.
    columns:
      - name: session_key
        data_tests:
          - relationships:
              to: ref('dim_session')
              field: session_key
      - name: driver_number
        data_tests:
          - relationships:
              to: ref('dim_driver')
              field: driver_number

  - name: fact_pit_stops
    description: One row per pit stop.
    columns:
      - name: session_key
        data_tests:
          - relationships:
              to: ref('dim_session')
              field: session_key
      - name: driver_number
        data_tests:
          # warn (not error): OpenF1 occasionally emits pit records for
          # phantom driver numbers (e.g. 241/243/247) that never appear in
          # the drivers endpoint. We surface the anomaly without failing the
          # build on corrupt upstream data.
          - relationships:
              to: ref('dim_driver')
              field: driver_number
              config:
                severity: warn

  - name: fact_race_results
    description: >
      One row per driver per Grand Prix or Sprint with final classification and
      points (each session type uses its own points scale).
    columns:
      - name: session_name
        data_tests:
          - accepted_values:
              values: ['Race', 'Sprint']
      - name: session_key
        data_tests:
          - relationships:
              to: ref('dim_session')
              field: session_key
      - name: driver_number
        data_tests:
          - relationships:
              to: ref('dim_driver')
              field: driver_number

  - name: fact_stints
    description: One row per driver per tyre stint (compound and lap range).
    columns:
      - name: session_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_session')
              field: session_key
      - name: driver_number
        data_tests:
          - relationships:
              to: ref('dim_driver')
              field: driver_number
              config:
                severity: warn

  - name: mart_pit_stop_performance
    description: Pit-stop performance ranked by team (median stationary time) across the season's races.
    columns:
      - name: team_name
        data_tests:
          - unique
          - not_null
      - name: median_stop_seconds
        data_tests:
          - not_null

  - name: mart_driver_standings
    description: Points per driver per race plus running cumulative total (championship evolution).
    columns:
      - name: cumulative_points
        data_tests:
          - not_null

  - name: mart_driver_pace
    description: Per-driver, per-race median lap time, fastest lap and lap-time consistency (std dev).
    columns:
      - name: median_lap_seconds
        data_tests:
          - not_null

  - name: fact_lap_conditions
    description: >
      One row per race lap with the conditions it was run in: weather joined
      as-of the lap (latest reading within 10 minutes) and whether the lap was
      neutralised by a safety car or VSC, read from the race-control event log.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [session_key, driver_number, lap_number]
    columns:
      - name: session_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_session')
              field: session_key
      - name: lap_number
        data_tests:
          - not_null
      - name: track_temperature
        description: Sensor zeros and sub-5C readings are nulled out as missing, not kept as cold.
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 5
              max_value: 70
      - name: air_temperature
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 50
      - name: weather_age_seconds
        description: How stale the as-of weather reading was. Capped at 600 by construction.
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 600
      - name: under_safety_car
        data_tests:
          - not_null
      - name: is_outlier_lap
        description: Lap longer than 3x the session median — a red-flag suspension or timing gap, not a pace measurement.
        data_tests:
          - not_null
